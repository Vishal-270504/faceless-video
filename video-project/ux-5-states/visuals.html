<style>
  #phone { position: absolute; left: 310px; top: 200px; width: 460px; height: 820px; border-radius: 56px; background: #1c1c24; padding: 14px; }
  #screen { position: relative; width: 432px; height: 792px; border-radius: 44px; background: #f4f4f6; overflow: hidden; }
  .scene { position: absolute; inset: 0; padding: 40px 32px; }
  .card { background: #fff; border-radius: 20px; padding: 28px; margin-bottom: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .bar { height: 28px; border-radius: 10px; background: #d9dce1; margin-bottom: 20px; }
  .h { font: 800 44px Arial, sans-serif; color: #111; line-height: 1.15; margin: 0 0 16px; }
  .p { font: 400 30px Arial, sans-serif; color: #555; line-height: 1.3; margin: 0 0 22px; }
  .btn { display: inline-block; background: #111; color: #fff; border-radius: 16px; padding: 18px 30px; font: 700 30px Arial, sans-serif; }
  .chip { background: #fff; border: 3px solid #111; border-radius: 40px; padding: 22px 30px; font: 700 36px Arial, sans-serif; color: #111; margin-bottom: 20px; text-align: center; }
  .banner { position: absolute; left: 0; right: 0; top: 0; background: #e5484d; color: #fff; padding: 30px; font: 700 34px Arial, sans-serif; text-align: center; }
  .q { font: 800 300px Arial, sans-serif; color: #111; text-align: center; margin-top: 120px; }
  .center { display: flex; flex-direction: column; justify-content: center; height: 100%; }
</style>

<div id="phone">
  <div id="screen">
    <div id="s0" class="scene clip" data-start="0" data-duration="5.2" data-track-index="1"></div>
    <div id="s1" class="scene clip" data-start="5.3" data-duration="5.5" data-track-index="1">
      <div class="center">
        <div class="chip">Loading</div>
        <div class="chip">Empty</div>
        <div class="chip">Error</div>
        <div class="chip">Offline</div>
        <div class="chip">Not found</div>
      </div>
    </div>
    <div id="s2" class="scene clip" data-start="10.8" data-duration="5.2" data-track-index="1">
      <div class="card">
        <div class="bar"></div><div class="bar"></div><div class="bar" style="width:60%"></div>
      </div>
      <div class="card">
        <div class="bar"></div><div class="bar"></div><div class="bar" style="width:60%"></div>
      </div>
      <div class="card">
        <div class="bar"></div><div class="bar" style="width:70%"></div>
      </div>
    </div>
    <div id="s3" class="scene clip" data-start="16.0" data-duration="4.7" data-track-index="1">
      <div class="center">
        <div class="h">No notes yet</div>
        <div class="p">Start with one idea.</div>
        <div><span class="btn">+ Add note</span></div>
      </div>
    </div>
    <div id="s4" class="scene clip" data-start="20.7" data-duration="5.1" data-track-index="1">
      <div class="center">
        <div class="h">Couldn't load notes.</div>
        <div class="p">Check your connection, then try again.</div>
        <div><span class="btn">Retry</span></div>
      </div>
    </div>
    <div id="s5" class="scene clip" data-start="25.7" data-duration="5.9" data-track-index="1">
      <div class="banner">You're offline</div>
      <div class="center">
        <div class="card"><div class="p" style="text-decoration: line-through; margin: 0;">Failed to fetch</div></div>
      </div>
    </div>
    <div id="s6" class="scene clip" data-start="31.6" data-duration="7.1" data-track-index="1">
      <div class="center">
        <div class="h">This note no longer exists</div>
        <div class="p">The list refreshes.</div>
        <div><span class="btn">Refresh list</span></div>
      </div>
    </div>
    <div id="s7" class="scene clip" data-start="38.7" data-duration="4.2" data-track-index="1">
      <div class="center">
        <div class="h" style="font-size: 60px; text-align: center;">Always show what's happening</div>
      </div>
    </div>
    <div id="s8" class="scene clip" data-start="42.9" data-duration="1.8" data-track-index="1">
      <div class="q">?</div>
    </div>
  </div>
</div>

<script>
  tl.set("#phone", { opacity: 1 }, 0);
  tl.from("#phone", { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" }, 0);
  tl.from("#s1 .chip", { opacity: 0, y: 30, duration: 0.3, stagger: 0.4 }, 5.4);
  tl.from("#s2 .card", { opacity: 0, y: 20, duration: 0.3, stagger: 0.15 }, 10.9);
  tl.to("#s2 .bar", { opacity: 0.35, duration: 0.6, yoyo: true, repeat: 4, stagger: 0.12, ease: "sine.inOut" }, 11.3);
  tl.from("#s3 .h, #s3 .p, #s3 .btn", { opacity: 0, y: 20, duration: 0.35, stagger: 0.2 }, 16.1);
  tl.from("#s4 .h, #s4 .p, #s4 .btn", { opacity: 0, y: 20, duration: 0.35, stagger: 0.2 }, 20.8);
  tl.from("#s5 .banner", { y: -120, duration: 0.45, ease: "power3.out" }, 26.0);
  tl.from("#s5 .card", { opacity: 0, duration: 0.4 }, 26.4);
  tl.from("#s6 .h, #s6 .p, #s6 .btn", { opacity: 0, y: 20, duration: 0.35, stagger: 0.2 }, 31.7);
  tl.from("#s7 .h", { opacity: 0, y: 30, duration: 0.5 }, 38.8);
  tl.from("#s8 .q", { opacity: 0, scale: 0.6, duration: 0.5, ease: "back.out(2)" }, 43.0);
</script>
